# CI for BazrMarket/bazr-sdk.
#
# Every step here runs a command that passes on a clean checkout of this
# repository, and nothing else. A step is added when the command it runs passes
# locally, and not before: a red build teaches everyone to stop reading the
# build.
#
# Lockfiles are committed for both packages, so `npm ci` is used rather than
# `npm install` and the setup-node dependency cache has something to key on.
#
# The two jobs are ordered rather than parallel. `bazr-cli` resolves `@bazr/sdk`
# from its lockfile as a link to `../sdk-ts`, and its test suite builds both
# bundles, so a broken SDK surfaces as a confusing CLI failure if the SDK job has
# not already reported.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sdk:
    name: SDK typecheck, build and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/sdk-ts
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: packages/sdk-ts/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Verify the ESM entry point loads and the score maths runs
        run: |
          node --input-type=module -e "
          import { normalizedScore } from './dist/index.js';
          import assert from 'node:assert/strict';
          const axes = [
            { key: 'holder_dispersion', score: 80, weight: 30, status: 'ok' },
            { key: 'lp_residual', score: 60, weight: 30, status: 'ok' },
            { key: 'dev_wallet_state', score: null, weight: 40, status: 'unknown' },
          ];
          const n = normalizedScore(axes);
          assert.equal(n.unknown.length, 1, 'an unknown axis must be reported, not dropped');
          assert.equal(n.observed.length, 2);
          assert.equal(n.scoreRounded, 70, 'an unknown axis must leave the denominator, not count as 0');
          assert.ok(n.weightCoverage > 0 && n.weightCoverage < 1, 'coverage must report the missing weight');
          console.log('esm entry PASS, score=' + n.scoreRounded + ' coverage=' + n.weightCoverage.toFixed(2));
          "

      - name: Verify the CommonJS entry point loads
        run: |
          node -e "
          const assert = require('node:assert/strict');
          const m = require('./dist/index.cjs');
          assert.equal(typeof m.normalizedScore, 'function');
          assert.equal(typeof m.createBazrClient, 'function');
          console.log('cjs entry PASS');
          "

  cli:
    name: CLI typecheck, build, test and glyph gate
    runs-on: ubuntu-latest
    needs: sdk
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: packages/cli/package-lock.json

      # The CLI links @bazr/sdk from ../sdk-ts, so the sibling package needs its
      # own dependencies present before anything in packages/cli runs.
      - name: Install SDK dependencies
        working-directory: packages/sdk-ts
        run: npm ci --no-audit --no-fund

      # And it needs the sibling *built*, not merely installed. `@bazr/sdk`
      # points its types at dist/index.d.ts, so with no dist the link resolves
      # to a directory that declares nothing and tsc reports
      # `TS2307: Cannot find module '@bazr/sdk'` for every import, followed by a
      # wave of TS7006 as the callbacks that used those types fall back to
      # `any`. The TS7006 errors are downstream noise; TS2307 is the whole fault.
      #
      # A local checkout hides this, because whoever runs the CLI tests has
      # almost always built the SDK at some point and dist/ is still sitting
      # there. Verified by removing packages/sdk-ts/dist and running the CLI
      # typecheck: 13 TS2307 errors and exit 2, matching CI exactly; restoring
      # dist/ returns it to exit 0.
      - name: Build the SDK the CLI links against
        working-directory: packages/sdk-ts
        run: npm run build

      - name: Install CLI dependencies
        working-directory: packages/cli
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        working-directory: packages/cli
        run: npm run typecheck

      - name: Build
        working-directory: packages/cli
        run: npm run build

      - name: Test
        working-directory: packages/cli
        run: npm test

      # The control group runs first. A detector that always fails passes an
      # audit just as easily as one that always succeeds, so the scan itself is
      # worth nothing until the selftest has reported.
      - name: Glyph gate control group
        working-directory: packages/cli
        run: npm run gate:emoji:selftest

      - name: Glyph gate
        working-directory: packages/cli
        run: npm run gate:emoji

      - name: Verify the built binary runs as a real process
        working-directory: packages/cli
        run: |
          node dist/bazr.js --version
          node dist/bazr.js --help > /dev/null
          echo 'binary PASS'
